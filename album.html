<button type="button" aria-label="Ảnh trước" id="lb-prev" style="position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; left: 10px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button type="button" aria-label="Ảnh sau" id="lb-next" style="position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; right: 10px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
<p style="position: absolute; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center; color: #FFFFFF; font-size: 13px; letter-spacing: 0.1em"><span id="lb-count"></span></p>
</div>

<script>
(function(){
  const q = location.search;
  document.querySelectorAll('a[href="./"]').forEach(a => a.href = './' + q);
  const ON = "min-height: 40px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; border: 1.5px solid #764347; background: #764347; color: #FFFFFF", OFF = "min-height: 40px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; border: 1.5px solid #764347; background: transparent; color: #764347";
  const items = [...document.querySelectorAll('.grid .it')];
  const lb = document.getElementById('lb'), img = document.getElementById('lb-img'), cnt = document.getElementById('lb-count');
  let list = items, idx = -1;
  document.querySelectorAll('[data-cat][style]').forEach(b => {
    if (b.classList.contains('it')) return;
    b.addEventListener('click', () => {
      const c = b.dataset.cat;
      document.querySelectorAll('[role=group] button').forEach(x => x.setAttribute('style', x === b ? ON : OFF));
      items.forEach(it => it.hidden = !(c === 'all' || it.dataset.cat === c));
      list = items.filter(it => !it.hidden);
    });
  });
  function show(i) {
    idx = (i + list.length) % list.length;
    const im = list[idx].querySelector('img');
    img.src = im.src; img.alt = im.alt; cnt.textContent = (idx + 1) + ' / ' + list.length;
    lb.hidden = false; document.body.style.overflow = 'hidden';
  }
  function hide() { lb.hidden = true; document.body.style.overflow = ''; }
  items.forEach(it => it.addEventListener('click', () => show(list.indexOf(it))));
  document.getElementById('lb-close').addEventListener('click', hide);
  document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); show(idx - 1); });
  document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); show(idx + 1); });
  lb.addEventListener('click', e => { if (e.target === lb.firstElementChild) hide(); });
  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') hide(); else if (e.key === 'ArrowLeft') show(idx - 1); else if (e.key === 'ArrowRight') show(idx + 1);
  });
  let x0 = null;
  lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  lb.addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
  });
})();
</script>
